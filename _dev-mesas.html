<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEV — Explorador de Mesas</title>
<link rel="stylesheet" href="dashboard-mesa-cash.css">
<style>
  body{padding:0}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  .devnav{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--bg);z-index:20;flex-wrap:wrap;align-items:center}
  .devnav button{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink3);border:1px solid var(--bdr);background:var(--surf);cursor:pointer}
  .devnav button.on{color:var(--ink);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
  .pg{display:none}.pg.on{display:block}
  .mx-pg{padding:6px 12px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf);color:var(--ink);font-size:11px;cursor:pointer}
  .mx-pg:disabled{opacity:.4;cursor:default}
  #mxDrawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:200;overflow-y:auto;padding:24px}
  #mxDrawer.open{display:block}
  .mx-drawer-inner{max-width:900px;margin:0 auto;background:var(--bg);border:1px solid var(--bdr);border-radius:14px;padding:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div class="devnav">
  <b style="color:var(--gold);margin-right:8px">DEV</b>
  <button class="on" onclick="dv('mesas',this)">Explorador de Mesas</button>
  <button onclick="dv('player',this)">Perfil de Jogador</button>
  <button onclick="dv('eco',this)">Ecologia</button>
  <button onclick="dv('rake',this)">Rake &amp; Stakes</button>
  <span class="mx-week" style="margin-left:auto;font-size:11px;color:var(--ink3)"></span>
  <label style="background:var(--gold);color:#1a1205;font-weight:800;font-size:11px;border-radius:8px;padding:7px 12px;cursor:pointer">Subir .xlsx completo<input type="file" accept=".xlsx" style="display:none" onchange="cashIngestFile(this)"></label>
  <label style="border:1px solid var(--bdr);color:var(--ink);font-size:11px;border-radius:8px;padding:7px 12px;cursor:pointer">Roster .json<input type="file" accept=".json" style="display:none" onchange="cashRosterLoadFile(this)"></label>
  <button onclick="toggleTheme()">🌓</button>
</div>

<div class="wrap">
  <div id="pg-mesas" class="pg on">
    <div id="mxControls"></div>
    <div style="height:4px;border-radius:3px;background:var(--surf);margin-top:8px;overflow:hidden"><div id="mxProgress" style="height:100%;width:0;background:var(--gold);transition:width .2s"></div></div>
    <div id="mxStatus" style="font-size:11px;color:var(--ink3);margin-top:6px"></div>
    <div id="mxList"></div>
  </div>
  <div id="pg-player" class="pg">
    <div style="display:flex;gap:8px;margin-bottom:10px"><input id="mpSearch" placeholder="Buscar jogador por nome ou ID…" oninput="cashMpSearch(this.value)" style="flex:1;height:34px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf);color:var(--ink);padding:0 12px;font-size:12px"></div>
    <div id="mpBody"></div>
  </div>
  <div id="pg-eco" class="pg"><div id="mecoBody"></div></div>
  <div id="pg-rake" class="pg"><div id="mrakeBody"></div></div>
</div>
<div id="mxDrawer" onclick="if(event.target===this)cashMxClose()"></div>

<script>
function dv(id,btn){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));document.querySelectorAll('.devnav button').forEach(b=>b.classList.remove('on'));document.getElementById('pg-'+id).classList.add('on');if(btn)btn.classList.add('on');}
function toggleTheme(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');}
</script>
<script src="cash-ingest.js"></script>
<script src="cash-players.js"></script>
<script>cashRosterLoadURL('_dev-roster-sample.json').catch(e=>{document.getElementById('mxStatus').textContent='erro: '+e.message;});</script>
</body>
</html>
